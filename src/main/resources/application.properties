# 공통 설정 (프로파일 무관) - DB URL, Sentry DSN, S3, API 키 등은 프로파일별 파일에서 설정

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.indent_output=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

logging.level.root=INFO

# Actuator 노출 (방식 A: 메인 포트에 prometheus 노출)
# 프로파일별 파일(prod/staging)에서 이 값을 오버라이드하며, 오버라이드가 없는 local은 이 기본값을 사용.
# 주의: /actuator/prometheus 공개 노출은 인프라 계층(nginx/보안그룹)에서 외부 접근 차단 필요.
management.endpoints.web.exposure.include=health,info,prometheus

# 공통 메트릭 태그 — 모든 메트릭에 자동 부착 (PromQL/Grafana 필터·집계용).
# env 태그는 프로파일별 파일(prod/staging/local)에서 각각 지정.
management.metrics.tags.application=knittda

# HTTP 지연 퍼센타일·SLO 계측
# percentiles-histogram: 촘촘한 버킷을 생성해 Prometheus histogram_quantile 로 p95/p99 계산 가능하게 함.
# slo: 지정한 경계(누적 버킷)를 추가해 "N ms 이내 응답 비율"(SLO 달성률)을 계산 가능하게 함.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=200ms,500ms,1s,2s

# 외부 의존성 호출(external.call)도 히스토그램으로 → p95/p99 계산 가능
# (외부 호출은 지연 편차가 커 SLO 경계도 넉넉히)
management.metrics.distribution.percentiles-histogram.external.call=true
management.metrics.distribution.slo.external.call=100ms,500ms,1s,3s,10s
