version: '3.8'
services:
  app-green:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-green
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
      SPRINGDOC_SERVER_URL: http://13.125.122.193

    ports:
      - "8081:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  app-blue:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-blue
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # SPRING_JPA_HIBERNATE_DDL_AUTO 오버라이드 제거함 — app-green과 동일한 이유(위 주석 참고).
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
      SPRINGDOC_SERVER_URL: http://13.125.122.193

    ports:
      - "8082:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: knittda-nginx
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /home/ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    restart: always
    depends_on:
      - swagger-ui

  app-test:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-test
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_test
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: staging
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
      SPRINGDOC_SERVER_URL: http://13.125.122.193:8083
    ports:
      - "8083:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  directus:
    image: directus/directus:latest
    container_name: knittda-directus
    env_file:
      - .env
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: mysql
      DB_HOST: knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com
      DB_PORT: 3306
      DB_DATABASE: knittda_cms
      DB_USER: admin
      DB_PASSWORD: ${MYSQL_PASSWORD}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

      TZ: Asia/Seoul

      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${AWS_ACCESS_KEY_ID}
      STORAGE_S3_SECRET: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_S3_BUCKET: ${S3_BUCKET_NAME}
      STORAGE_S3_ROOT: cms/article
      STORAGE_S3_REGION: ap-northeast-2

    ports:
      - "8055:8055"
    restart: always

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    restart: unless-stopped
    environment:
        URLS: >-
          [{url: "/specs/staging", name: "Knittda API (staging)"},
          {url: "/specs/prod",    name: "Knittda API (prod)"},
          {url: "/specs/directus", name: "Directus CMS"}]
        URLS_PRIMARY_NAME: "Knittda API (staging)"
        PERSIST_AUTHORIZATION: "true"
    ports:
      - "8088:8080"

  # ── 모니터링 수집기: blue/green/test 를 내부 스크레이프 → Grafana Cloud remote_write ──
  # 인바운드 포트 없음(아웃바운드만). 설정/토큰은 /home/ubuntu/monitoring 에 위치.
  # 실행: docker compose up -d agent  
  agent:
    image: prom/prometheus:latest
    container_name: knittda-agent
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --agent
    volumes:
      - /home/ubuntu/monitoring/prometheus-agent.yml:/etc/prometheus/prometheus.yml:ro
      - /home/ubuntu/monitoring/gc_token:/etc/prometheus/gc_token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - app-test
