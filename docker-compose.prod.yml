version: '3.8'
services:
  app-green:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-green
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # SPRING_JPA_HIBERNATE_DDL_AUTO 오버라이드 제거함 — application-prod.properties의
      # spring.jpa.hibernate.ddl-auto=validate가 실제로 적용되도록 함(기존엔 여기서 update로
      # 덮어써서 prod가 암묵적으로 Hibernate 자동 스키마 변경 모드로 동작하고 있었음).
      # 이후 스키마 변경은 sql/ 아래 스크립트를 배포 전 RDS에 수동 적용해야 한다.
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  app-blue:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-blue
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # SPRING_JPA_HIBERNATE_DDL_AUTO 오버라이드 제거함 — app-green과 동일한 이유(위 주석 참고).
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: knittda-nginx
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /home/ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - swagger-ui

  app-test:
    image: 331704540909.dkr.ecr.ap-northeast-2.amazonaws.com/knittda-server:latest
    container_name: knittda-app-test
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com:3306/knittda_test
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # SPRING_JPA_HIBERNATE_DDL_AUTO 오버라이드 제거함 — application-staging.properties에 이미
      # ddl-auto=update가 선언돼 있어 동작은 동일하나, properties 파일과 실제 배포 설정이 다시
      # 어긋나는 걸 방지하기 위해 여기서도 제거(스키마 정책의 단일 진실 공급원을 properties로 통일).
      SPRING_PROFILES_ACTIVE: staging
      OPENAI_API_KEY: ${OPEN_AI_KEY}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      SERVER_PORT: 8080
    ports:
      - "8083:8080"
    restart: always
    volumes:
      - /home/ubuntu/logs:/app/logs

  directus:
    image: directus/directus:latest
    container_name: knittda-directus
    env_file:
      - .env
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: mysql
      DB_HOST: knittda-db.c9o4y6280l3u.ap-northeast-2.rds.amazonaws.com
      DB_PORT: 3306
      DB_DATABASE: knittda_cms
      DB_USER: admin
      DB_PASSWORD: ${MYSQL_PASSWORD}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

      TZ: Asia/Seoul

      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${AWS_ACCESS_KEY_ID}
      STORAGE_S3_SECRET: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_S3_BUCKET: ${S3_BUCKET_NAME}
      STORAGE_S3_ROOT: cms/article
      STORAGE_S3_REGION: ap-northeast-2

    ports:
      - "8055:8055"
    restart: always

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    restart: unless-stopped
    environment:
      # SWAGGER_JSON_URL: "http://13.125.122.193:8055/server/specs/oas"
      SWAGGER_JSON_URL: /directus-oas
    ports:
      - "8088:8080"

  # ── 모니터링 수집기: blue/green/test 를 내부 스크레이프 → Grafana Cloud remote_write ──
  # 토큰은 .env 의 GRAFANA_CLOUD_TOKEN 에서 주입(다른 시크릿과 동일 관리). 인바운드 포트 없음.
  agent:
    image: prom/prometheus:latest
    container_name: knittda-agent
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - 'printf "%s" "$$GRAFANA_CLOUD_TOKEN" > /tmp/gc_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --agent'
    volumes:
      - /home/ubuntu/monitoring/prometheus-agent.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - app-test
