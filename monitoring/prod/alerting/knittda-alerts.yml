      #     severity: warning
      #     service: knittda
      #   annotations:
      #     summary: "[{{ $labels.slot }}] p99 {{ $value | printf \"%.2f\" }}s (>2s) 5분"
      #     description: "느린 엔드포인트·외부의존·DB 확인(대시보드 p95/외부 p95 패널)."
