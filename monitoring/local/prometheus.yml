global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 로컬 앱 계측 스크레이프 (compose 네트워크 내부: 호스트 8083 아니라 컨테이너 8080)
  - job_name: knittda
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
        labels:
          env: local
          slot: local
